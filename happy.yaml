happy:
  cluster:
    name: "cluster-0001"
    namespace: "db"
    uri: "postgres://postgres:test_pass@localhost:5432" 
    backups: "s3://cloudnative-pg-bakups-010skdkv11/backups"
    strategy: "checkpoint"
  healthchecks:
  - name: postgres_version
    statement: "select version()"
    return: "string"
  - name: database_count
    statement: "select count (*) from pg_database"
    return: "int"
