clusters:
  - name: "cluster-0001"
    namespace: "db"
    # defaults are always on unless
    check_db_instance_health: false
    checks:
      - name: postgres_version
        statement: "select version()"
        enabled: false
      - name: database_count
        statement: "select count (*) from pg_database"
        every: "30s"
        rise: 2
        fall: 5
  - name: "cluster-0002"
    namespace: "db-1"
    use_pooler: false
    checks: []
  - name: "cluster-0003"
    namespace: "db-2"
    use_primary: true
    use_defaults: false
    checks: []


# defaults, true values not required
#
# use_pooler true     when false, falls back to use_secondary
# use_primary false
# use_secondary false
# use_instance string by name
# enabled true
