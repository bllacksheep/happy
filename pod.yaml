---
apiVersion: v1
kind: Namespace
metadata:
  name: happy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: happy-sa
  namespace: happy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: happy-role
  namespace: db # must be in cluster ns
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: happy-rb
  namespace: db   # must be in cluster ns
subjects:
  - kind: ServiceAccount
    name: happy-sa
    namespace: happy-system
roleRef:
  kind: Role
  name: happy-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: happy-creds
  namespace: happy-system
type: Opaque
stringData:
  DB_CONNECTION_URI: "postgres://app:i6eqlujhbiLjvWwi02sNXCYBh6FKKDwwuSzDFQCqCgEsFy3J05g2FogWlM4hk6QE@pooler-rw.db:5432"
  DB_USERNAME: app
  DB_PASSWORD: KhCxGHMpbbM2Fmd06NTtlpqZYITVB51YaBC3lyBewRNidVp1FAPjAXOzC5LWM0u3
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: happy-system
  name: happy-cm
data:
  happy.yaml: | 
    happy:
      shared_checks:
        - name: postgres_version
          query: "select version()"
          expect: "some version"
          enabled: true
      check_cluster_endpoint: true
      check_wal_replication: true
      check_last_backup: true
      check_db_instance: true
      check_rpo_health: true
      threshold:
        every: "10s"
        rise: 3
        fall: 3
      clusters:
        - name: "cluster-0001"
          namespace: "db-1"
          use_defaults: true
          backup_test:
            enabled: true
            target_namespace: "db"
          use_pooler: true
          check_rpo_health: false
          exempt_from:
            - postgres_version
          checks:
            - name: database_count
              query: "select count (*) from pg_database"
              expect: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: happy
  namespace: happy-system
  labels:
    app: happy
spec:
  serviceAccountName: happy-sa
  containers:
    - name: happy
      image: maclighiche/happy:0.0.43
      volumeMounts:
        - name: happy-conf
          mountPath: /happy.yaml
          subPath: happy.yaml
      envFrom:
        - secretRef:
            name: happy-creds
  volumes:
    - name: happy-conf
      configMap:
        name: happy-cm

