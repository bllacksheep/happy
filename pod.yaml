---
apiVersion: v1
kind: Namespace
metadata:
  name: happy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: happy-sa
  namespace: happy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: happy-role
  namespace: db # must be in cluster ns
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: happy-rb
  namespace: db   # must be in cluster ns
subjects:
  - kind: ServiceAccount
    name: happy-sa
    namespace: happy-system
roleRef:
  kind: Role
  name: happy-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: happy-creds
  namespace: happy-system
type: Opaque
stringData:
  DB_CONNECTION_URI: "postgres://app:KhCxGHMpbbM2Fmd06NTtlpqZYITVB51YaBC3lyBewRNidVp1FAPjAXOzC5LWM0u3@pooler-rw.db:5432"
  DB_USERNAME: app
  DB_PASSWORD: KhCxGHMpbbM2Fmd06NTtlpqZYITVB51YaBC3lyBewRNidVp1FAPjAXOzC5LWM0u3
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: happy-system
  name: happy-cm
data:
  happy.yaml: | 
    happy:
      default:
        healthchecks:
          check_cluster_endpoint_health: true
          check_wal_replication_health: true
          check_last_backup_health: true
          check_db_instance_health: true
          check_rpo_health: true
        threshold:
          every: "10s"
          rise: 3
          fall: 3
      clusters:
        - name: "cluster-0001"
          namespace: "db"
          checks:
            - name: postgres_version
              statement: "select version()"
              enabled: false
            - name: database_count
              statement: "select count (*) from pg_database"
              every: "30s"
              rise: 2
              fall: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: happy
  namespace: happy-system
  labels:
    app: happy
spec:
  serviceAccountName: happy-sa
  containers:
    - name: happy
      image: maclighiche/happy:0.0.18
      volumeMounts:
        - name: happy-conf
          mountPath: /happy.yaml
          subPath: happy.yaml
      envFrom:
        - secretRef:
            name: happy-creds
  volumes:
    - name: happy-conf
      configMap:
        name: happy-cm

