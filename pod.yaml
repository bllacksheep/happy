---
apiVersion: v1
kind: Namespace
metadata:
  name: happy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: happy-sa
  namespace: happy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: happy-role
  namespace: db # must be in cluster ns
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: happy-rb
  namespace: db   # must be in cluster ns
subjects:
  - kind: ServiceAccount
    name: happy-sa
    namespace: happy-system
roleRef:
  kind: Role
  name: happy-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: happy-creds
  namespace: happy-system
type: Opaque
stringData:
  DB_CONNECTION_URI: "postgres://app:i6eqlujhbiLjvWwi02sNXCYBh6FKKDwwuSzDFQCqCgEsFy3J05g2FogWlM4hk6QE@pooler-rw.db:5432"
  DB_USERNAME: app
  DB_PASSWORD: KhCxGHMpbbM2Fmd06NTtlpqZYITVB51YaBC3lyBewRNidVp1FAPjAXOzC5LWM0u3
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: happy-system
  name: happy-cm
data:
  happy.yaml: | 
    happy:
      # optional defaults
      defaults:
        cluster_endpoint_health: false
        # global for all clusters
        checks: []
        threshold:
          every: "15s"
          rise: 3
          fall: 3
      clusters:
        - name: "cluster-0001"
          namespace: "db"
          checks:
            sql:
              - name: postgres_version
                statement: "select version()"
                every: "10s"
                enabled: false
              - name: database_count
                statement: "select count (*) from pg_database"
                # optional threshold
                every: "5s"
                rise: 2
                fall: 5
            http:
              - name: http_test
                endpoint: "https://"
                enabled: true
                expected: "abc"
---
apiVersion: v1
kind: Pod
metadata:
  name: happy
  namespace: happy-system
  labels:
    app: happy
spec:
  serviceAccountName: happy-sa
  containers:
    - name: happy
      image: maclighiche/happy:0.0.43
      volumeMounts:
        - name: happy-conf
          mountPath: /happy.yaml
          subPath: happy.yaml
      envFrom:
        - secretRef:
            name: happy-creds
  volumes:
    - name: happy-conf
      configMap:
        name: happy-cm

