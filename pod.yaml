---
apiVersion: v1
kind: Namespace
metadata:
  name: happy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: happy-sa
  namespace: happy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: happy-role
  namespace: db # must be in cluster ns
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: happy-rb
  namespace: db   # must be in cluster ns
subjects:
  - kind: ServiceAccount
    name: happy-sa
    namespace: happy-system
roleRef:
  kind: Role
  name: happy-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: happy-system
  name: happy-cm
data:
  happy.yaml: | 
    happy:
      cluster:
        name: "cluster-0001"
        namespace: "db"
        uri: "postgres://postgres:test_pass@localhost:5432"
        backups: "s3://cloudnative-pg-bakups-010skdkv11/backups"
        strategy: "checkpoint"
      healthchecks:
        every: "30s"
        rise: 3
        fall: 3
        defaults:
          check_cluster_endpoint_health: true
          check_wal_replication_health: true
          check_last_backup_health: true
          check_db_instance_health: true
          check_rpo_health: true
        custom_checks:
          - name: postgres_version
            statement: "select version()"
            every: 10s
            rise: 3
            fall: 3
          - name: database_count
            statement: "select count (*) from pg_database"
            every: 10s
            rise: 3
            fall: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: happy
  namespace: happy-system
  labels:
    app: happy
spec:
  serviceAccountName: happy-sa
  containers:
    - name: happy
      image: maclighiche/happy:0.0.6
      volumeMounts:
        - name: happy-conf
          mountPath: /happy.yaml
          subPath: happy.yaml
  volumes:
    - name: happy-conf
      configMap:
        name: happy-cm

